<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Board Game 🌍</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#163b42;background:#e7f7ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#d4f8e5,#eaf7ff 65%);min-height:100vh}header{text-align:center;padding:22px 10px 5px}h1{font-size:clamp(25px,4vw,43px);margin:0;color:#176b58}h2{margin:0 0 13px}.sub{color:#55767b}main{max-width:1180px;margin:auto;padding:15px}.panel{background:white;border-radius:20px;box-shadow:0 8px 28px #164d4920;padding:22px;margin-bottom:17px}.entry{max-width:520px;margin:25px auto}input{border:2px solid #c9dfd9;border-radius:12px;padding:13px;font:inherit;width:100%;margin:6px 0 12px}button{border:0;border-radius:12px;background:#159d75;color:white;font-weight:800;padding:13px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#3d7bc0}.gold{background:#e8a522;color:#36270c}.danger{background:#d75865}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.tile{min-height:91px;border-radius:12px;background:#e9f5f0;border:2px solid #b4dacc;padding:7px;position:relative;text-align:center}.tile.W{background:#e1f0ff;border-color:#a6cffa}.tile.S{background:#fff0dc;border-color:#f7cb85}.tile.G{background:#f3e6ff;border-color:#d4b1ef}.tile.start,.tile.finish{background:#b9f2d6;border-color:#50c48f}.num{font-size:12px;color:#59717b}.symbol{font-size:24px;font-weight:900}.tokens{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.token{font-size:19px;line-height:1.1}.score{padding:10px;border-bottom:1px solid #e0ece8}.score.active{background:#e3faee;border-radius:10px}.score small{color:#63817f}.question{border:2px solid #b4dccc;background:#f6fff9;border-radius:15px;padding:18px;margin-top:15px}.question p{font-size:clamp(18px,2.4vw,25px);font-weight:750;line-height:1.5}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#ecf2ff;color:#163b42;border:2px solid #bdd4fa}.choice.selected{background:#bed9ff;border-color:#447ed7}.log{font-size:13px;line-height:1.7;max-height:200px;overflow:auto}.notice{padding:12px;border-radius:12px;background:#fff5d6;margin:12px 0}.code{font-size:30px;font-weight:900;letter-spacing:4px;color:#146e60}.pill{display:inline-block;padding:6px 11px;background:#edf8f5;border-radius:99px;font-weight:700}.muted{color:#63817f}.footer{text-align:center;font-size:12px;color:#607c78;padding:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}.board{gap:4px}.tile{min-height:66px;padding:4px;border-radius:8px}.symbol{font-size:19px}.token{font-size:14px}.panel{padding:13px}}
</style></head><body><header><h1>🌎 Earth Board Game</h1><div class="sub">Lesson 12 · We Should Save the World</div></header><main><section id="entry" class="panel entry"><h2>🌱 함께 지구를 구해요!</h2><label>이름</label><input id="name" placeholder="예: 김하늘 / 1모둠" maxlength="20"><div class="flex"><button id="create" class="secondary">👩‍🏫 교사: 방 만들기</button></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><label>학생: 선생님이 알려준 방 코드</label><input id="roomcode" placeholder="예: AB123" maxlength="5" style="text-transform:uppercase"><button id="join">🎮 방 입장하기</button><div id="entryMsg" class="notice hidden"></div></section><section id="game" class="hidden"><div class="panel"><div class="flex" style="justify-content:space-between"><div><div class="muted">우리 반 게임 코드</div><div class="code" id="code"></div></div><div><span class="pill" id="status">대기 중</span> <button id="copy" class="secondary">코드 복사</button></div></div><p id="hostHint" class="muted"></p><button id="start" class="hidden">🚀 게임 시작</button></div><div class="layout"><div><section class="panel"><div class="flex" style="justify-content:space-between"><h2>🗺️ 지구 탐험 말판</h2><span class="pill" id="turn"></span></div><div id="board" class="board"></div><div id="action" class="question"></div></section></div><aside><section class="panel"><h2>🏆 실시간 점수</h2><div id="players"></div></section><section class="panel"><h2>📣 게임 기록</h2><div id="log" class="log"></div></section><section class="panel"><h2>📖 규칙</h2><p>🎲 주사위를 던져 이동하세요.</p><p>🔤 W: 단어 쓰기 (1점)</p><p>💬 S: 바른 문장 고르기 (1점)</p><p>💎 보석: 영어로 읽고 완료 누르기 (1~3점)</p><p>🏁 끝에 도착하면 완주! 모든 학생이 완주하면 종료됩니다.</p></section></aside></div></section></main><div class="footer">수업용 · 영어 6학년 12단원 · 선생님과 함께 진행하세요</div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let state=null,me=null,isHost=false,selected=null,lastRoll='';const icons=['🦊','🐼','🐸','🐯','🐰','🐨','🐙','🦁'];function message(m){$('entryMsg').textContent=m;$('entryMsg').classList.remove('hidden')}function enter(code){$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('code').textContent=code}
$('create').onclick=()=>socket.emit('create',{name:$('name').value||'Teacher'},r=>r.error?message(r.error):(isHost=true,enter(r.code)));$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('roomcode').value},r=>{if(r.error)return message(r.error);me=socket.id;try{sessionStorage.setItem('earthPlayer',JSON.stringify({code:r.code,token:r.token}))}catch(e){}enter(r.code)});$('start').onclick=()=>socket.emit('start',{},r=>r.error&&alert(r.error));$('copy').onclick=()=>navigator.clipboard?.writeText(state.code).then(()=>alert('방 코드를 복사했습니다.')).catch(()=>prompt('방 코드:',state.code));
function render(){if(!state)return;const p=state.players.find(x=>x.id===me),current=state.players[state.turn];$('status').textContent=state.finished?'🏆 종료':state.started?'🎮 진행 중':'⏳ 입장 대기';$('hostHint').textContent=!state.started?'학생들이 방 코드를 입력하면 이곳에 표시됩니다. 교사가 시작 버튼을 누르면 게임이 시작됩니다.':state.finished?'게임이 종료되었습니다. 점수를 확인하세요.':'한 명씩 주사위를 던지고 문제를 풀어보세요.';$('start').classList.toggle('hidden',!isHost||state.started);$('turn').textContent=state.started&&!state.finished&&current?'🎯 '+current.name+' 차례':'학생 '+state.players.length+'명';$('board').innerHTML=state.board.map((t,i)=>`<div class="tile ${i===0?'start':i===32?'finish':t}"><div class="num">${i===0?'START':i===32?'FINISH':String(i).padStart(2,'0')}</div><div class="symbol">${i===0?'🌱':i===32?'🏁':t==='G'?'💎':t}</div><div class="tokens">${state.players.map((p,j)=>p.pos===i?`<span class="token" title="${safe(p.name)}">${icons[j%icons.length]}</span>`:'').join('')}</div></div>`).join('');$('players').innerHTML=[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="score ${current?.id===p.id&&state.started&&!state.finished?'active':''}"><strong>${icons[state.players.findIndex(x=>x.id===p.id)]} ${safe(p.name)}</strong> ${p.finished?'🏁':''}<div>⭐ ${p.score}점 · ${p.pos}/32 칸 ${p.online?'':'(연결 끊김)'}</div></div>`).join('')||'학생 입장을 기다리는 중';$('log').innerHTML=state.log.slice().reverse().map(x=>`<div>• ${safe(x)}</div>`).join('');let html='';if(state.finished)html='<h2>🏆 Game Over!</h2><p>모두 수고했어요! 환경을 보호하는 일을 영어로 말해 봅시다.</p>';else if(!state.started)html='<p>🌿 친구들이 입장하면 시작할 수 있어요.</p>';else if(isHost)html='<p>👩‍🏫 교사용 화면입니다. 학생들의 진행 상황을 확인하세요.</p>';else if(current?.id!==me)html='<p>⏳ 친구의 차례예요. 응원해 주세요!</p>';else if(!state.question)html=`<p>🎲 ${safe(p?.name||'')}님, 주사위를 던져 주세요!</p><button id="roll">🎲 주사위 던지기</button>`;else{const q=state.question;html=`<div class="pill">${q.type==='W'?'🔤 Words':q.type==='S'?'💬 Sentences':'💎 Gem'} · ${q.points}점</div><p>${safe(q.text)}</p>`;if(q.type==='S')html+=q.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${i+1}) ${safe(c)}</button>`).join('')+'<button id="submit">정답 제출</button>';else if(q.type==='W')html+='<input id="answer" autocomplete="off" placeholder="영어로 답을 입력하세요"><button id="submit">정답 제출</button>';else html+='<p class="muted">영어 문장을 소리 내어 읽은 다음 완료 버튼을 누르세요. 친구나 선생님이 읽기를 확인해 주세요.</p><button id="gem" class="gold">💎 문장 읽기 완료</button>'} $('action').innerHTML=html;selected=null;$('roll')?.addEventListener('click',()=>socket.emit('roll',{},r=>{if(r.error)alert(r.error);else alert('🎲 '+r.roll+'칸 이동!')}));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b))});$('submit')?.addEventListener('click',()=>{let ans=state.question.type==='S'?selected:$('answer').value;if(ans===null||!String(ans).trim())return alert('답을 입력하거나 선택하세요.');socket.emit('answer',{answer:ans},r=>{if(r.error)alert(r.error);else alert(r.correct?'✅ 정답입니다!':'❌ 아쉬워요! 정답: '+r.correctAnswer)})});$('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});$('gem')?.addEventListener('click',()=>socket.emit('gem',{},r=>r.error&&alert(r.error)))}function safe(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}socket.on('state',s=>{state=s;render()});function banner(t){let b=$('netBanner');if(!b){b=document.createElement('div');b.id='netBanner';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#d75865;color:#fff;text-align:center;padding:10px;font-weight:800';document.body.appendChild(b)}b.textContent=t;b.style.display=t?'block':'none'}
socket.on('disconnect',()=>{if(!$('game').classList.contains('hidden'))banner('인터넷 연결이 끊겼어요. 다시 연결하는 중… (새로고침해도 괜찮아요)')});
socket.on('connect',()=>{let saved=null;try{saved=JSON.parse(sessionStorage.getItem('earthPlayer'))}catch(e){}if(!saved){banner('');return}socket.emit('rejoin',saved,r=>{if(r.ok){me=socket.id;enter(r.code);banner('')}else{try{sessionStorage.removeItem('earthPlayer')}catch(e){}banner('');if(!$('game').classList.contains('hidden')){$('game').classList.add('hidden');$('entry').classList.remove('hidden')}message(r.error)}})});
</script></body></html>
